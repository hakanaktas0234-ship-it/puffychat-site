name: Shorts paylaşım önizlemeleri
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: shorts-share-previews
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test test/shorts-share.test.mjs
      - run: node scripts/shorts-onizleme.mjs
      - name: Publish only generated preview pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name puffy-bot
          git config user.email bot@puffychat.com
          git add -- shorts s
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update public Shorts share previews"
          git pull --rebase origin main
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
